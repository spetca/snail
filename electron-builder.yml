appId: com.snail.app
productName: Snail
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
extraResources:
  - from: src/native/build/Release
    to: native
    filter:
      - '**/*.node'
mac:
  icon: build/icons/mac/icon.icns
  target:
    - target: dmg
      arch:
        - arm64
  identity: null
linux:
  icon: build/icons/png/1024x1024.png
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Utility
  # Pass --no-sandbox at launch for distros with restrictive user-namespace policies
  executableArgs:
    - --no-sandbox
    - --disable-dev-shm-usage
